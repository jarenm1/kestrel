[package]
name = "kestrel-guest-agent"
version = "0.1.0"
edition = "2021"
description = "Guest agent of a Kestrel Nest VM: talks to the host over vsock and to the box over a Unix socket"
publish = false

[[bin]]
name = "kestrel-guest-agent"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
