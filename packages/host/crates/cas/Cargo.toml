[package]
name = "kestrel-cas"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Content-addressed blob store and namespaced key refs for Nest VMs"
publish = false

[[bin]]
name = "kestrel-cas"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
