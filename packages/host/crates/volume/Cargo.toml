[package]
name = "kestrel-volume"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4.3"
hkdf = "0.13"
hmac = "0.13"
jiff = "0.2.39"
libc = "0.2.191"
libublk = "0.4.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusty-s3 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
